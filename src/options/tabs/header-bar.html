<section>
  <label>
    <span>Compact header bar</span>
    <input type="checkbox" id="compactHeaderBar">
  </label>
  <div class="expandable">
    <label>
      <span>Only on the watch page</span>
      <input type="checkbox" id="compactHeaderBarWatchOnly">
    </label>
  </div>
  <label>
    <span>Make logo redirect to another page</span>
    <input type="checkbox" id="ytLogoSubsPage">
  </label>
  <div class="expandable">
    <label>
      <span>Page</span>
      <button class="page" placeholder="Open a YouTube page" value="/feed/subscriptions" id="ylspPage">
      </button>
      <button class="removeSetting">
      </button>
    </label>
  </div>
  <label>
    <span>Open search results in new tab <span class="subLabel">Adds a 'Open in a new tab' button to the search
        box.</span>
    </span>
    <input type="checkbox" id="sResultsInNewTab">
  </label>
</section>
<section>
  <h4>Hide</h4>
  <label>
    <span>Hide search bar</span>
    <input type="checkbox" id="hideSearchBar">
  </label>
  <div class="expandable">
    <label>
      <span>Only on the watch page</span>
      <input type="checkbox" id="hideSearchBarWatchOnly">
    </label>
  </div>
  <label>
    <span>Voice search button</span>
    <input type="checkbox" id="hideVoiceSearchButton">
  </label>
  <label>
    <span>Create button</span>
    <input type="checkbox" id="hideCreateButton">
  </label>
</section>
